<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portal Login Staff & Admin Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1rem;
    }
    .login-card {
      background: white;
      border-radius: 1.5rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .google-btn {
      background: #ffffff;
      border: 1px solid #dadce0;
      color: #3c4043;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
    }
    .google-btn:hover {
      background: #f8f9fa;
      border-color: #c1c7cd;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }
    .demo-pill {
      cursor: pointer;
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 20px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      transition: all 0.15s;
    }
    .demo-pill:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="login-card p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-25 text-warning rounded-circle mb-3" style="width: 68px; height: 68px; font-size: 2rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Masuk Sistem Cafe</h4>
      <p class="text-muted small">Khusus Super Admin, Kasir & Petugas Dapur</p>
    </div>

    <div id="loginAlert" class="alert alert-danger small py-2" style="display:none;" role="alert"></div>

    <form id="loginForm" onsubmit="handleCustomEmailLogin(event)">
      <!-- Google Sign In Button Utama -->
      <button type="button" class="google-btn mb-3" onclick="simulateGoogleOAuth()">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Masuk dengan Google (Gmail)</span>
      </button>

      <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1 text-muted">
        <span class="mx-2 text-muted small">atau masukkan email Gmail</span>
        <hr class="flex-grow-1 text-muted">
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold text-secondary">Email Gmail Terdaftar</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
          <input type="email" id="emailInput" class="form-control border-start-0" placeholder="nama@gmail.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-3 text-white shadow-sm" style="background:#ea580c; border:none;">
        <i class="bi bi-box-arrow-in-right me-1"></i> Verifikasi & Masuk
      </button>
    </form>

    <!-- Akun Coba Instan untuk Demo -->
    <div class="mt-4 pt-3 border-top">
      <small class="text-secondary fw-bold d-block mb-2">⚡ Coba Cepat (Akun Bawaan):</small>
      <div class="d-flex flex-wrap gap-2">
        <div class="demo-pill" onclick="quickFill('admin@gmail.com', 'admin')">
          👑 <strong>Admin</strong> (admin@gmail.com)
        </div>
        <div class="demo-pill" onclick="quickFill('kasir1@gmail.com', 'kasir')">
          💵 <strong>Kasir</strong> (kasir1@gmail.com)
        </div>
        <div class="demo-pill" onclick="quickFill('dapur1@gmail.com', 'dapur')">
          👨‍🍳 <strong>Dapur</strong> (dapur1@gmail.com)
        </div>
      </div>
    </div>

    <div class="text-center mt-4">
      <a href="index.html" class="text-decoration-none small text-muted">
        <i class="bi bi-arrow-left"></i> Kembali ke Menu Utama
      </a>
    </div>
  </div>

  <script>
    function quickFill(email) {
      document.getElementById('emailInput').value = email;
      loginWithEmail(email);
    }

    function simulateGoogleOAuth() {
      // Simulasi autentikasi Google Sign-In popup
      const email = prompt("Simulasi Akun Google: Masukkan Gmail Anda (Contoh: admin@gmail.com / dapur1@gmail.com / kasir1@gmail.com):", "admin@gmail.com");
      if (email) {
        loginWithEmail(email.trim());
      }
    }

    function handleCustomEmailLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      loginWithEmail(email);
    }

    async function loginWithEmail(email) {
      const alertBox = document.getElementById('loginAlert');
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/google-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, name: email.split('@')[0] })
        });
        const data = await res.json();

        if (data.success) {
          // Simpan session di browser
          localStorage.setItem('cafe_user', JSON.stringify(data.user));

          // Arahkan sesuai peran
          if (data.user.role === 'super_admin' || data.user.role === 'admin') {
            window.location.href = 'admin.html';
          } else if (data.user.role === 'kasir') {
            window.location.href = 'cashier.html';
          } else if (data.user.role === 'dapur') {
            window.location.href = 'kitchen.html';
          }
        } else {
          alertBox.innerText = data.message;
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'Gagal menghubungi server cafe: ' + err.message;
        alertBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
