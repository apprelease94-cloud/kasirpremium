<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Layar Monitor Dapur - KDS Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .kds-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      transition: all 0.2s;
    }
    .kds-card.status-menunggu {
      border-top: 5px solid #f59e0b;
    }
    .kds-card.status-proses {
      border-top: 5px solid #3b82f6;
    }
    .kds-card.status-siap {
      border-top: 5px solid #10b981;
    }
    .table-badge {
      background: #ea580c;
      color: white;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 12px;
    }
    .time-badge {
      background: #334155;
      color: #cbd5e1;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .tab-kds-btn {
      border-radius: 20px;
      padding: 6px 18px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
    }
    .tab-kds-btn.active {
      background: #ea580c;
      color: white;
      border-color: #ea580c;
    }
    .receipt-modal-body {
      background: #ffffff;
      color: #000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.35;
    }
  </style>
</head>
<body class="p-3 p-md-4">

  <!-- Header Monitor Khusus Dapur -->
  <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom border-secondary flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <div class="fs-2 text-warning"><i class="bi bi-fire"></i></div>
      <div>
        <h4 class="fw-bold mb-0">Kitchen Display System (KDS) & Barista</h4>
        <small class="text-secondary" id="kitchenUserLabel">Login sebagai: Dapur</small>
      </div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div class="text-end d-none d-md-block">
        <div id="liveClock" class="fw-bold fs-5">00:00:00</div>
        <small class="text-success"><i class="bi bi-circle-fill" style="font-size:8px;"></i> Live Antrean Masak</small>
      </div>
      <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="logoutKitchen()">
        <i class="bi bi-box-arrow-left me-1"></i> Keluar
      </button>
    </div>
  </div>

  <!-- Tab Navigasi Dapur: Antrean Aktif VS Riwayat Selesai -->
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex gap-2">
      <button class="tab-kds-btn active" id="tabActiveBtn" onclick="switchKitchenTab('active')">
        <i class="bi bi-hourglass-split me-1"></i> Antrean Memasak Aktif (<span id="countActiveOrders">0</span>)
      </button>
      <button class="tab-kds-btn" id="tabHistoryBtn" onclick="switchKitchenTab('history')">
        <i class="bi bi-clock-history me-1"></i> Riwayat Pesanan Selesai (<span id="countHistoryOrders">0</span>)
      </button>
    </div>
    <div>
      <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="fetchKitchenOrders()">
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Summary Stats Dapur -->
  <div class="row g-3 mb-4" id="kitchenStatsRow">
    <div class="col-md-3 col-6">
      <div class="p-3 bg-secondary bg-opacity-25 rounded-3 border border-secondary text-center">
        <span class="text-muted small">Menunggu Dimasak</span>
        <h3 class="fw-bold mb-0 text-white" id="statMenunggu">0</h3>
      </div>
    </div>
    <div class="col-md-3 col-6">
      <div class="p-3 bg-warning bg-opacity-10 rounded-3 border border-warning text-center">
        <span class="text-warning small">Sedang Dimasak</span>
        <h3 class="fw-bold text-warning mb-0" id="statProses">0</h3>
      </div>
    </div>
    <div class="col-md-3 col-6">
      <div class="p-3 bg-success bg-opacity-10 rounded-3 border border-success text-center">
        <span class="text-success small">Siap Saji (Antar ke Meja)</span>
        <h3 class="fw-bold text-success mb-0" id="statSiap">0</h3>
      </div>
    </div>
    <div class="col-md-3 col-6">
      <div class="p-3 bg-info bg-opacity-10 rounded-3 border border-info text-center">
        <span class="text-info small">Meja Aktif</span>
        <h3 class="fw-bold text-info mb-0" id="statMeja">0</h3>
      </div>
    </div>
  </div>

  <!-- Grid Order Cards -->
  <div class="row g-3" id="ordersGrid"></div>

  <!-- MODAL: CEK DETAIL STRUK TRANSAKSI (BISA DIBUKA DAPUR & ADMIN) -->
  <div class="modal fade" id="modalReceiptDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 bg-dark text-white">
        <div class="modal-header border-secondary pb-2">
          <h5 class="modal-title fw-bold"><i class="bi bi-receipt text-warning me-2"></i> Rincian Struk Pembelian</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-3">
          <div class="receipt-modal-body shadow-sm" id="receiptModalContent">
            <!-- Diisi live oleh JS -->
          </div>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-secondary w-100 rounded-pill small" data-bs-dismiss="modal">
            Tutup Struk
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('cafe_user') || '{}');
    if (!user.email || (user.role !== 'dapur' && user.role !== 'super_admin' && user.role !== 'admin')) {
      alert("⚠️ AKSES DITOLAK!\n\nHalaman Layar Monitor Dapur hanya bisa diakses oleh Koki/Barista Dapur atau Super Admin yang sudah login.\n\nSilakan login terlebih dahulu.");
      window.location.href = 'login.html';
    }

    document.getElementById('kitchenUserLabel').innerText = `Petugas: ${user.name || user.email} (${user.role.toUpperCase()})`;

    function logoutKitchen() {
      localStorage.removeItem('cafe_user');
      window.location.href = 'login.html';
    }

    setInterval(() => {
      document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('id-ID');
    }, 1000);

    let currentTab = 'active'; // 'active' atau 'history'
    let activeOrdersData = [];
    let historyOrdersData = [];

    function switchKitchenTab(tab) {
      currentTab = tab;
      document.getElementById('tabActiveBtn').classList.toggle('active', tab === 'active');
      document.getElementById('tabHistoryBtn').classList.toggle('active', tab === 'history');
      
      // Sembunyikan stats row jika di tab history
      document.getElementById('kitchenStatsRow').style.display = tab === 'active' ? 'flex' : 'none';

      renderKitchen();
    }

    async function fetchKitchenOrders() {
      try {
        // Ambil data aktif (filter ketat agar pesanan 'Selesai' TIDAK PERNAH masuk antrian aktif)
        const resActive = await fetch('/api/orders?view=active', {
          headers: { 'x-user-email': user.email }
        });
        const dataActive = await resActive.json();
        if (dataActive.success) {
          const rawActive = dataActive.data || [];
          activeOrdersData = rawActive.filter(o => o.status !== 'Selesai');
          document.getElementById('countActiveOrders').innerText = activeOrdersData.length;
          updateKitchenStats(activeOrdersData);
        }

        // Ambil data riwayat selesai
        const resHistory = await fetch('/api/orders?view=history', {
          headers: { 'x-user-email': user.email }
        });
        const dataHistory = await resHistory.json();
        if (dataHistory.success) {
          const rawHistory = dataHistory.data || [];
          historyOrdersData = rawHistory.filter(o => o.status === 'Selesai');
          document.getElementById('countHistoryOrders').innerText = historyOrdersData.length;
        }

        renderKitchen();
      } catch (e) {
        console.error("Gagal sinkronisasi data dapur:", e);
      }
    }

    function updateKitchenStats(orders) {
      document.getElementById('statMenunggu').innerText = orders.filter(o => !o.status.includes('Dimasak') && o.status !== 'Siap Disajikan').length;
      document.getElementById('statProses').innerText = orders.filter(o => o.status === 'Sedang Dimasak').length;
      document.getElementById('statSiap').innerText = orders.filter(o => o.status === 'Siap Disajikan').length;
      
      const occupiedTables = new Set(orders.map(o => o.tableNumber));
      document.getElementById('statMeja').innerText = occupiedTables.size;
    }

    function renderKitchen() {
      const grid = document.getElementById('ordersGrid');
      const isHistory = currentTab === 'history';
      const orders = isHistory ? historyOrdersData : activeOrdersData;

      if (orders.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi ${isHistory ? 'bi-journal-check' : 'bi-inbox'} fs-1 text-secondary"></i>
            <h5 class="text-secondary mt-2">${isHistory ? 'Belum ada riwayat pesanan yang diselesaikan.' : 'Dapur santai! Belum ada antrean makanan.'}</h5>
            <p class="text-muted small">${isHistory ? 'Pesanan yang selesai diantar akan tersimpan rapi di sini.' : 'Pesanan dari barcode meja tamu akan otomatis masuk ke sini.'}</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = orders.map(order => {
        const isPaid = order.paymentStatus === 'PAID' || 
                       order.status === 'Sudah Dibayar' || 
                       order.status.includes('Sudah Dibayar') || 
                       order.status === 'Sedang Dimasak' || 
                       order.status === 'Siap Disajikan' || 
                       order.status === 'Selesai';

        let statusClass = isPaid ? 'status-menunggu' : 'border-danger';

        if (order.status === 'Sedang Dimasak') {
          statusClass = 'status-proses';
        } else if (order.status === 'Siap Disajikan') {
          statusClass = 'status-siap';
        } else if (order.status === 'Selesai') {
          statusClass = 'border-success';
        }

        const itemsList = order.items.map(item => `
          <div class="d-flex justify-content-between align-items-start py-2 border-bottom border-secondary border-opacity-50">
            <div>
              <span class="fw-bold fs-6 text-white">${item.qty}x</span> <span class="fs-6 text-white">${item.name}</span>
              ${item.variant ? `<br><span class="badge bg-danger small px-2 py-1 mt-1" style="font-size:0.75rem;"><i class="bi bi-fire"></i> ${item.variant}</span>` : ''}
              ${item.notes ? `<br><small class="text-warning fst-italic">Catatan: "${item.notes}"</small>` : ''}
            </div>
          </div>
        `).join('');

        const orderTime = new Date(order.createdAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        const completedTime = order.completedAt ? new Date(order.completedAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '-';

        // Kotak Informasi Persiapan Dapur (HANYA SUDAH DIBAYAR ATAU BELUM DIBAYAR)
        let kitchenNoticeBox = '';
        if (!isPaid) {
          kitchenNoticeBox = `
            <div class="p-2 my-2 rounded-3 small border border-danger bg-danger bg-opacity-10 text-danger fw-semibold d-flex align-items-center">
              <i class="bi bi-exclamation-octagon-fill fs-5 me-2 flex-shrink-0"></i>
              <div><strong>BELUM DIBAYAR:</strong> Tunggu konfirmasi kasir sebelum menyiapkan hidangan.</div>
            </div>
          `;
        } else if (order.status === 'Sedang Dimasak') {
          kitchenNoticeBox = `
            <div class="p-2 my-2 rounded-3 small border border-primary bg-primary bg-opacity-10 text-primary fw-semibold d-flex align-items-center">
              <i class="bi bi-fire fs-5 me-2 flex-shrink-0"></i>
              <div><strong>SUDAH DIBAYAR:</strong> Sedang dimasak oleh koki dapur & barista.</div>
            </div>
          `;
        } else if (order.status === 'Siap Disajikan') {
          kitchenNoticeBox = `
            <div class="p-2 my-2 rounded-3 small border border-success bg-success bg-opacity-10 text-success fw-semibold d-flex align-items-center">
              <i class="bi bi-bell-fill fs-5 me-2 flex-shrink-0"></i>
              <div><strong>SUDAH DIBAYAR:</strong> Hidangan siap saji! Pelayan menuju Meja ${order.tableNumber}.</div>
            </div>
          `;
        } else if (order.status === 'Selesai') {
          kitchenNoticeBox = `
            <div class="p-2 my-2 rounded-3 small border border-secondary bg-secondary bg-opacity-10 text-secondary fw-semibold d-flex align-items-center">
              <i class="bi bi-check2-all fs-5 me-2 flex-shrink-0"></i>
              <div>Pesanan telah selesai dihidangkan ke Meja ${order.tableNumber}.</div>
            </div>
          `;
        } else {
          // Sudah bayar tapi belum mulai masak
          kitchenNoticeBox = `
            <div class="p-2 my-2 rounded-3 small border border-success bg-success bg-opacity-10 text-success fw-semibold d-flex align-items-center">
              <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
              <div><strong>SUDAH DIBAYAR:</strong> Bisa proses menyiapkan hidangan di dapur.</div>
            </div>
          `;
        }

        return `
          <div class="col-12 col-md-6 col-xl-4 mb-3">
            <div class="kds-card p-3 h-100 d-flex flex-column justify-content-between ${statusClass}">
              <div>
                <div class="d-flex align-items-center justify-content-between mb-2">
                  <span class="table-badge"><i class="bi bi-geo-alt-fill me-1"></i> MEJA ${order.tableNumber}</span>
                  <div class="text-end">
                    <!-- HANYA MENAMPILKAN SUDAH DIBAYAR ATAU BELUM DIBAYAR -->
                    <span class="badge ${isPaid ? 'bg-success text-white' : 'bg-danger text-white'} mb-1 px-3 py-1 fs-6 fw-bold shadow-sm">
                      <i class="bi ${isPaid ? 'bi-check-circle-fill' : 'bi-hourglass-split'} me-1"></i>
                      ${isPaid ? 'SUDAH DIBAYAR' : 'BELUM DIBAYAR'}
                    </span>
                    <div class="time-badge">Order: ${orderTime} WIB</div>
                  </div>
                </div>

                <div class="small text-secondary mb-2">
                  <strong>${order.customerName}</strong> | #${order.id} | 
                  ${isHistory ? `<span class="text-success"><i class="bi bi-check2-circle"></i> Selesai: ${completedTime} WIB</span>` : `<span class="text-info"><i class="bi bi-stopwatch"></i> Estimasi: ~${order.estimatedMinutes} mnt</span>`}
                </div>

                ${kitchenNoticeBox}

                <div class="my-3">
                  ${itemsList}
                </div>
              </div>

              <!-- Footer Aksi Koki & Cek Struk -->
              <div class="pt-2 border-top border-secondary">
                <div class="d-flex gap-2">
                  <!-- Tombol Cek Isi Struk Lengkap -->
                  <button class="btn btn-outline-info btn-sm rounded-pill fw-semibold" onclick="viewReceiptDetail('${order.id}')">
                    <i class="bi bi-receipt me-1"></i> Cek Struk
                  </button>

                  <div class="flex-grow-1">
                    ${!isHistory && !isPaid && order.status !== 'Sedang Dimasak' && order.status !== 'Siap Disajikan' && order.status !== 'Selesai' ? `
                      <button class="btn btn-secondary btn-sm w-100 fw-bold rounded-pill text-white" disabled style="cursor: not-allowed; opacity: 0.65;" title="Terkunci: Menunggu Pembayaran Selesai">
                        <i class="bi bi-lock-fill me-1"></i> Terkunci (Tunggu Bayar)
                      </button>
                    ` : ''}

                    ${!isHistory && isPaid && order.status !== 'Sedang Dimasak' && order.status !== 'Siap Disajikan' && order.status !== 'Selesai' ? `
                      <button class="btn btn-warning btn-sm w-100 fw-bold text-dark rounded-pill shadow-sm" onclick="updateKitchenStatus('${order.id}', 'Sedang Dimasak')">
                        <i class="bi bi-fire me-1"></i> Masak Sekarang
                      </button>
                    ` : ''}

                    ${!isHistory && order.status === 'Sedang Dimasak' ? `
                      <button class="btn btn-success btn-sm w-100 fw-bold text-white rounded-pill shadow-sm" onclick="updateKitchenStatus('${order.id}', 'Siap Disajikan')">
                        <i class="bi bi-bell-fill me-1"></i> Siap Saji!
                      </button>
                    ` : ''}

                    ${!isHistory && order.status === 'Siap Disajikan' ? `
                      <button class="btn btn-outline-light btn-sm w-100 rounded-pill" onclick="updateKitchenStatus('${order.id}', 'Selesai')">
                        <i class="bi bi-check2-all me-1"></i> Selesai (Pindah ke Riwayat)
                      </button>
                    ` : ''}

                    ${isHistory || order.status === 'Selesai' ? `
                      <span class="badge bg-success-subtle text-success w-100 py-2 rounded-pill">
                        <i class="bi bi-check-all"></i> Sudah Dihidangkan (Selesai)
                      </span>
                    ` : ''}
                  </div>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');
    }

    // Aksi Koki menyelesaikan pesanan: Pesanan langsung HILANG dari antrean aktif & PINDAH ke riwayat
    async function updateKitchenStatus(orderId, newStatus) {
      try {
        const res = await fetch(`/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'x-user-email': user.email
          },
          body: JSON.stringify({ status: newStatus })
        });
        const data = await res.json();
        if (data.success) {
          if (newStatus === 'Selesai') {
            // Beri notif ringan bahwa pesanan berhasil dipindahkan ke riwayat
            alert(`Pesanan #${orderId} (Meja ${data.order.tableNumber}) telah SELESAI!\nPesanan otomatis diarsipkan ke tab "Riwayat Pesanan Selesai".`);
          }
          fetchKitchenOrders();
        } else {
          alert("⚠️ Akses Ditolak: " + (data.message || "Gagal update status"));
        }
      } catch (err) {
        alert("Gagal koneksi ke server cafe.");
      }
    }

    // Modal Cek Isi Struk Transaksi Lengkap (HANYA Menampilkan SUDAH DIBAYAR atau BELUM DIBAYAR)
    function viewReceiptDetail(orderId) {
      const order = [...activeOrdersData, ...historyOrdersData].find(o => o.id === orderId);
      if (!order) return;

      const isPaid = order.paymentStatus === 'PAID' || 
                     order.status === 'Sudah Dibayar' || 
                     order.status.includes('Sudah Dibayar') || 
                     order.status === 'Sedang Dimasak' || 
                     order.status === 'Siap Disajikan' || 
                     order.status === 'Selesai';

      const subtotal = order.items.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const tax = Math.round(subtotal * 0.10);
      const grandTotal = order.totalAmount;
      const orderDate = new Date(order.createdAt).toLocaleString('id-ID');

      const itemsHtml = order.items.map(it => `
        <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
          <span><strong>${it.qty}x</strong> ${it.name}</span>
          <span>Rp ${(it.price * it.qty).toLocaleString('id-ID')}</span>
        </div>
        ${it.variant ? `<div style="font-size:10px; color:#555; margin-left:14px;">- ${it.variant}</div>` : ''}
        ${it.notes ? `<div style="font-size:10px; color:#555; margin-left:14px;">- Catatan: ${it.notes}</div>` : ''}
      `).join('');

      document.getElementById('receiptModalContent').innerHTML = `
        <div style="text-align: center; margin-bottom: 8px;">
          <div style="font-size: 15px; font-weight: bold;">KOPI & MIE CAFE</div>
          <div style="font-size: 11px;">Resto & Eatery Indonesia</div>
        </div>
        <div style="border-top: 1px dashed #000; margin: 4px 0;"></div>
        <div style="display: flex; justify-content: space-between;">
          <span>No Order: #${order.id}</span>
          <span>Meja: <strong>${order.tableNumber}</strong></span>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span>Pelanggan: ${order.customerName}</span>
          <span style="font-weight: bold; color: ${isPaid ? '#10b981' : '#ef4444'};">
            ${isPaid ? '✅ SUDAH DIBAYAR' : '⏳ BELUM DIBAYAR'}
          </span>
        </div>
        <div style="font-size: 10px; color: #555;">Waktu Order: ${orderDate}</div>
        <div style="border-top: 1px dashed #000; margin: 4px 0;"></div>

        <div style="margin: 6px 0;">
          ${itemsHtml}
        </div>

        <div style="border-top: 1px dashed #000; margin: 4px 0;"></div>
        <div style="display: flex; justify-content: space-between;">
          <span>Subtotal:</span>
          <span>Rp ${subtotal.toLocaleString('id-ID')}</span>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span>Pajak (10%):</span>
          <span>Rp ${tax.toLocaleString('id-ID')}</span>
        </div>
        <div style="border-top: 1px dashed #000; margin: 4px 0;"></div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
          <span>TOTAL:</span>
          <span>Rp ${grandTotal.toLocaleString('id-ID')}</span>
        </div>
        <div style="border-top: 1px dashed #000; margin: 4px 0;"></div>
        <div style="text-align: center; margin-top: 6px; font-weight: bold;">
          STATUS BAYAR: ${isPaid ? 'SUDAH DIBAYAR (BISA DIMASAK)' : 'BELUM DIBAYAR'}<br>
          PROSES DAPUR: ${order.status.toUpperCase()}
        </div>
      `;

      new bootstrap.Modal(document.getElementById('modalReceiptDetail')).show();
    }

    fetchKitchenOrders();
    setInterval(fetchKitchenOrders, 3000);
  </script>
</body>
</html>
